[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-listing-recon"
version = "0.1.0"
description = "Inspect and benchmark web research into historical UK-listed companies"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]

[tool.setuptools.package-data]
recon = ["schema.sql", "google_extract.js"]
